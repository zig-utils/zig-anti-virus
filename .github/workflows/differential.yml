name: Differential

# zav against libclamav (and yara): tools/diff/README.md. The case files under
# tests/differential/cases record libclamav's verdicts; this workflow checks that the pinned
# ClamAV release still gives them, and that zav does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

env:
  ZIG_VERSION: '0.17.0-dev.1857+3c46da14d'
  # The official Cisco-Talos build, the same release the expectations were recorded with.
  CLAMAV_VERSION: '1.5.4'

jobs:
  grammar:
    name: Signature grammar against libclamav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install ClamAV ${{ env.CLAMAV_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "clamav-$CLAMAV_VERSION" -R Cisco-Talos/clamav -p "clamav-$CLAMAV_VERSION.linux.x86_64.deb" -D "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/clamav-$CLAMAV_VERSION.linux.x86_64.deb"
          clamscan=$(dpkg -L clamav | grep -m1 '/bin/clamscan$')
          certs=$(dirname "$(dpkg -L clamav | grep -m1 '/certs/')")
          echo "CLAMSCAN=$clamscan" >> "$GITHUB_ENV"
          echo "CLAMAV_CERTS=$certs" >> "$GITHUB_ENV"
          "$clamscan" --version
      - run: zig build diff-tool
      - name: libclamav still gives the recorded verdicts
        run: python3 tools/diff/clamav.py --work "$RUNNER_TEMP/work" tests/differential/cases
      - name: zav gives them too
        run: zig build diff
      - name: zav agrees with yara on the YARA rules
        run: |
          python3 -m pip install --quiet yara-python
          python3 tools/diff/yara_check.py --work "$RUNNER_TEMP/ywork" tests/differential/cases
      - name: On failure, record what libclamav says
        if: failure()
        run: |
          python3 tools/diff/clamav.py --work "$RUNNER_TEMP/work" --record tests/differential/cases || true
          git diff > "$RUNNER_TEMP/recorded.diff"
          cat "$RUNNER_TEMP/recorded.diff" | head -200
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-verdicts
          path: ${{ runner.temp }}/recorded.diff

  realdb:
    name: Real databases against libclamav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install ClamAV ${{ env.CLAMAV_VERSION }}, PCRE2 and Python tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "clamav-$CLAMAV_VERSION" -R Cisco-Talos/clamav -p "clamav-$CLAMAV_VERSION.linux.x86_64.deb" -D "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/clamav-$CLAMAV_VERSION.linux.x86_64.deb" libpcre2-dev
          echo "CLAMSCAN=$(dpkg -L clamav | grep -m1 '/bin/clamscan$')" >> "$GITHUB_ENV"
          echo "CLAMAV_CERTS=$(dirname "$(dpkg -L clamav | grep -m1 '/certs/')")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet cvdupdate yara-python
      # database.clamav.net serves Cisco's cvdupdate, not generic clients. The databases are
      # cached between runs and never leave the runner.
      - name: Restore the ClamAV databases
        uses: actions/cache@v4
        with:
          path: ~/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      - name: Update the ClamAV databases
        run: |
          cvd config set --dbdir "$HOME/clamav-db"
          cvd update
          mkdir -p "$RUNNER_TEMP/db/main" "$RUNNER_TEMP/db/daily"
          tail -c +513 "$HOME/clamav-db/main.cvd" | tar xz -C "$RUNNER_TEMP/db/main"
          tail -c +513 "$HOME/clamav-db/daily.cvd" | tar xz -C "$RUNNER_TEMP/db/daily"
          chmod -R u+r "$RUNNER_TEMP/db"
          head -c 100 "$HOME/clamav-db/main.cvd"; echo; head -c 100 "$HOME/clamav-db/daily.cvd"; echo
      - run: zig build diff-tool -Doptimize=ReleaseSafe
      - name: Every line zav refuses has a reason libclamav's loading does not contradict
        run: |
          db="$RUNNER_TEMP/db"
          ./zig-out/bin/zav-diff rejects $db/main/*.ndb $db/main/*.ldb $db/main/*.cdb $db/daily/*.ndb $db/daily/*.ndu $db/daily/*.ldb $db/daily/*.ldu $db/daily/*.cdb $db/daily/*.ftm > "$RUNNER_TEMP/rejects.txt" || true
          cut -d: -f4 "$RUNNER_TEMP/rejects.txt" | sort | uniq -c
          # Unsupported features and regexes zig-regex refuses are expected; anything else is a
          # line libclamav loads and zav misreads.
          if cut -d: -f4 "$RUNNER_TEMP/rejects.txt" | grep -v -E '^ (fuzzy_image|icon|version_info)_unsupported$|^ regex_(syntax|unsupported)$'; then exit 1; fi
      - name: Every hex body prints back as written (P4.01 round trip)
        run: |
          db="$RUNNER_TEMP/db"
          ./zig-out/bin/zav-diff roundtrip $db/main/*.ndb $db/main/*.ldb $db/daily/*.ndb $db/daily/*.ndu $db/daily/*.ldb $db/daily/*.ldu
      - name: PCRE and byte-compare subsignatures, isolated
        run: |
          db="$RUNNER_TEMP/db"
          python3 tools/diff/realdb.py pcre --db $db/main --db $db/daily --out "$RUNNER_TEMP/pcre.case"
          python3 tools/diff/realdb.py bytecompare --db $db/main --db $db/daily --out "$RUNNER_TEMP/bc.case"
          python3 tools/diff/clamav.py --raw --record --work "$RUNNER_TEMP/rwork" "$RUNNER_TEMP/pcre.case" "$RUNNER_TEMP/bc.case" | tail -1
          ./zig-out/bin/zav-diff check --refusals-known --tmp "$RUNNER_TEMP/zd" "$RUNNER_TEMP/pcre.case" "$RUNNER_TEMP/bc.case"
      - name: P4.21 gate, zav and clamscan --bytecode=no over samples built from the signatures
        run: |
          db="$RUNNER_TEMP/db"
          python3 tools/diff/realdb.py gate --db $db/main --db $db/daily --out "$RUNNER_TEMP/gate"
          # Reported, not enforced yet: the remaining differences are scan-pipeline semantics
          # (embedded HTML re-typing a binary file) that zav-diff's reference scan does not model.
          python3 tools/diff/gate.py --cvd "$HOME/clamav-db/main.cvd" --cvd "$HOME/clamav-db/daily.cvd" --db $db/main --db $db/daily --tmp "$RUNNER_TEMP/gz" --show 120 "$RUNNER_TEMP/gate" || true
      - name: E13, zig-regex against PCRE2 on the PCRE subsigs and a public YARA rule set
        run: |
          git clone -q --depth 1 https://github.com/Yara-Rules/rules.git "$RUNNER_TEMP/yara-rules"
          db="$RUNNER_TEMP/db"
          python3 tools/diff/realdb.py corpus --db $db/main --db $db/daily --yara "$RUNNER_TEMP/yara-rules" --out "$RUNNER_TEMP/e13.txt"
          zig build e13 -Doptimize=ReleaseSafe -- "$RUNNER_TEMP/e13.txt" --show 60

  formats:
    name: Executable layouts and normalisers against libclamav (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install ClamAV ${{ env.CLAMAV_VERSION }} (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "clamav-$CLAMAV_VERSION" -R Cisco-Talos/clamav -p "clamav-$CLAMAV_VERSION.linux.x86_64.deb" -D "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/clamav-$CLAMAV_VERSION.linux.x86_64.deb"
          echo "CLAMSCAN=$(dpkg -L clamav | grep -m1 '/bin/clamscan$')" >> "$GITHUB_ENV"
          echo "CLAMAV_CERTS=$(dirname "$(dpkg -L clamav | grep -m1 '/certs/')")" >> "$GITHUB_ENV"
      # The official macOS package, unpacked rather than installed: its binaries get an rpath to
      # their libraries and an ad hoc signature.
      - name: Install ClamAV ${{ env.CLAMAV_VERSION }} (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "clamav-$CLAMAV_VERSION" -R Cisco-Talos/clamav -p "clamav-$CLAMAV_VERSION.macos.universal.pkg" -D "$RUNNER_TEMP"
          pkgutil --expand-full "$RUNNER_TEMP/clamav-$CLAMAV_VERSION.macos.universal.pkg" "$RUNNER_TEMP/pkg"
          root="$RUNNER_TEMP/clamav"
          mkdir -p "$root"
          cp -R "$RUNNER_TEMP"/pkg/*programs.pkg/Payload/usr/local/clamav/. "$RUNNER_TEMP"/pkg/*libraries.pkg/Payload/usr/local/clamav/. "$root/"
          for f in "$root/bin/clamscan" "$root"/lib/*.dylib; do
            [ -L "$f" ] && continue
            install_name_tool -add_rpath "$root/lib" "$f" 2>/dev/null || true
            codesign -f -s - "$f"
          done
          echo "CLAMSCAN=$root/bin/clamscan" >> "$GITHUB_ENV"
          echo "CLAMAV_CERTS=$root/etc/certs" >> "$GITHUB_ENV"
      - run: zig build diff-tool -Doptimize=ReleaseSafe
      - name: Entry points and sections
        run: |
          corpus="$RUNNER_TEMP/corpus"
          tools/diff/build_corpus.sh "$corpus/zig"
          python3 tools/diff/gen_pe.py "$corpus/pe-edge"
          dirs="$corpus"
          if [ "$RUNNER_OS" = Linux ]; then dirs="$dirs /usr/bin /usr/lib/x86_64-linux-gnu"; fi
          if [ "$RUNNER_OS" = macOS ]; then dirs="$dirs /opt/homebrew/bin /opt/homebrew/lib"; fi
          # clamscan --debug costs about 50 ms a file: bounded so the job stays short.
          python3 tools/diff/formats.py --limit 2500 --work "$RUNNER_TEMP/fwork" $dirs
      - name: Text and HTML normalisers
        run: |
          py=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')
          mkdir -p "$RUNNER_TEMP/text"
          find "$py" -name '*.py' -size -256k | head -1500 | while read -r f; do cp "$f" "$RUNNER_TEMP/text/$(echo "$f" | tr '/' '_')"; done
          find /usr/share/doc "$py" -name '*.html' -size -256k 2>/dev/null | head -500 | while read -r f; do cp "$f" "$RUNNER_TEMP/text/$(echo "$f" | tr '/' '_')"; done
          # HTML parity is incomplete (#45): counted, not enforced.
          python3 tools/diff/norm.py --html-report-only --work "$RUNNER_TEMP/nwork" "$RUNNER_TEMP/text"
