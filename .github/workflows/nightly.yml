name: Nightly fuzz

# Long deterministic fuzz runs with a fresh seed each night, plus the adversarial corpus in a
# ReleaseSafe build. Every PR already runs a 20k-iteration smoke (ci.yml); this is the depth.
# A failing seed is printed by the fuzzer and reproduces locally with -Dfuzz-seed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  ZIG_VERSION: '0.17.0-dev.1857+3c46da14d'

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Format parsers and decoders: one job per fmt.* target, so each gets its own
          # two-hour budget (all of them in one job stopped fitting at about 25 targets). Keep
          # this list in step with the Formats targets in tools/fuzz.zig.
          - { target: fmt.7z, iterations: 2000000 }
          - { target: fmt.bomb, iterations: 2000000 }
          - { target: fmt.bzip2, iterations: 2000000 }
          - { target: fmt.cab, iterations: 2000000 }
          - { target: fmt.chm, iterations: 2000000 }
          - { target: fmt.cpio, iterations: 2000000 }
          - { target: fmt.dmg, iterations: 2000000 }
          - { target: fmt.elf, iterations: 2000000 }
          - { target: fmt.gzip, iterations: 2000000 }
          - { target: fmt.html, iterations: 2000000 }
          - { target: fmt.iso9660, iterations: 2000000 }
          - { target: fmt.js, iterations: 2000000 }
          - { target: fmt.macho, iterations: 2000000 }
          - { target: fmt.mime, iterations: 2000000 }
          - { target: fmt.nsis, iterations: 2000000 }
          - { target: fmt.ole2, iterations: 2000000 }
          - { target: fmt.ooxml, iterations: 2000000 }
          - { target: fmt.pdf, iterations: 2000000 }
          - { target: fmt.pe, iterations: 2000000 }
          - { target: fmt.rtf, iterations: 2000000 }
          - { target: fmt.tar, iterations: 2000000 }
          - { target: fmt.text, iterations: 2000000 }
          - { target: fmt.upx, iterations: 2000000 }
          - { target: fmt.xz, iterations: 2000000 }
          - { target: fmt.zip, iterations: 2000000 }
          - { target: fmt.zstd, iterations: 2000000 }
          # Everything else in rotation.
          - { target: all, iterations: 5000000 }
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fuzz
        run: |
          seed=${{ github.run_id }}
          echo "seed $seed"
          if [ "${{ matrix.target }}" = "all" ]; then
            zig build fuzz -Doptimize=safe -Dfuzz-iterations=${{ matrix.iterations }} -Dfuzz-seed=$seed
          else
            zig build fuzz -Doptimize=safe -Dfuzz-iterations=${{ matrix.iterations }} -Dfuzz-seed=$seed -Dfuzz-target=${{ matrix.target }}
          fi

  adversarial:
    name: Adversarial corpus (ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=safe --summary all
