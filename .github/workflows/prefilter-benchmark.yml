name: Prefilter benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: '0.17.0-dev.1857+3c46da14d'
  CLAMAV_VERSION: '1.5.4'

jobs:
  native:
    name: E2 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      - name: Prepare ClamAV inputs
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 -m venv "$RUNNER_TEMP/cvd-tools"
          "$RUNNER_TEMP/cvd-tools/bin/pip" install --quiet cvdupdate
          mkdir -p "$HOME/clamav-db"
          cvd="$RUNNER_TEMP/cvd-tools/bin/cvd"
          "$cvd" config set --dbdir "$HOME/clamav-db"
          "$cvd" update
          mkdir -p "$RUNNER_TEMP/e2"
          {
            git rev-parse HEAD
            zig version
            uname -sr
            lscpu
            sha256sum "$HOME/clamav-db/main.cvd" "$HOME/clamav-db/daily.cvd" | sed 's|  .*/|  |'
            for input in main daily; do
              head -c 512 "$HOME/clamav-db/$input.cvd" | cut -d: -f1-6
              printf '\n'
            done
          } | tee "$RUNNER_TEMP/e2/inputs.txt"
      - name: Verify and materialize the B1, B2 and S1 manifests
        run: bun bench/fetch.ts B1 B2 S1 --out "$RUNNER_TEMP/corpus"
      - name: Build the full atom set and measure the PE partition
        run: |
          bench_dir="$RUNNER_TEMP/e2"
          db="$RUNNER_TEMP/e2.zavdb"
          zig build prefilter -Doptimize=ReleaseFast -- compile "$db" "$HOME/clamav-db/main.cvd" "$HOME/clamav-db/daily.cvd" 2>&1 | tee "$bench_dir/compile.txt"
          core=$(awk '/^Cpus_allowed_list:/ {split($2, ids, /[-,]/); print ids[1]}' /proc/self/status)
          printf 'Pinned CPU %s\n' "$core" | tee -a "$bench_dir/inputs.txt"
          for corpus in B1 B2; do
            taskset -c "$core" ./zig-out/bin/prefilter stages "$db" "$RUNNER_TEMP/corpus/$corpus" --partition 1 --rounds 5 2>&1 | tee "$bench_dir/$corpus.txt"
          done
          # The whole body scan (anchored index, prefilter, verify VM, deferred pass, logical
          # evaluation), files typed by magic, best of three scans per file.
          for corpus in B1 B2 S1; do
            taskset -c "$core" ./zig-out/bin/prefilter scan "$db" "$RUNNER_TEMP/corpus/$corpus" --rounds 3 2>&1 | grep -v '^LIMITED\|^FOUND' | tee "$bench_dir/$corpus-scan.txt"
          done
      - name: Install ClamAV ${{ env.CLAMAV_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="clamav-$CLAMAV_VERSION.linux.${{ matrix.arch }}.deb"
          gh release download "clamav-$CLAMAV_VERSION" -R Cisco-Talos/clamav -p "$package" -D "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/$package"
      - name: Measure clamd raw scans on the same corpora
        run: |
          bench_dir="$RUNNER_TEMP/e2"
          core=$(awk '/^Cpus_allowed_list:/ {split($2, ids, /[-,]/); print ids[1]}' /proc/self/status)
          clamd=$(dpkg -L clamav | awk '/\/clamd$/ {print; exit}')
          certs=$(dirname "$(dpkg -L clamav | awk '/\/certs\// {print; exit}')")
          test -x "$clamd" && test -d "$certs"
          mkdir -p "$RUNNER_TEMP/e2-clamd-db"
          ln -s "$HOME/clamav-db/"{main,daily}.cvd "$RUNNER_TEMP/e2-clamd-db/"
          socket="$RUNNER_TEMP/e2-clamd.sock"
          config="$RUNNER_TEMP/e2-clamd.conf"
          cat > "$config" <<EOF
          DatabaseDirectory $RUNNER_TEMP/e2-clamd-db
          CVDCertsDirectory $certs
          LocalSocket $socket
          LocalSocketMode 600
          Foreground yes
          MaxThreads 1
          DisableCache yes
          HeuristicAlerts no
          Bytecode no
          ScanPE no
          ScanELF no
          ScanOLE2 no
          ScanPDF no
          ScanSWF no
          ScanXMLDOCS no
          ScanHWP3 no
          ScanOneNote no
          ScanImage no
          ScanImageFuzzyHash no
          ScanMail no
          ScanHTML no
          ScanArchive no
          MaxFileSize 400M
          MaxScanSize 1000M
          EOF
          taskset -c "$core" "$clamd" --config-file "$config" > "$RUNNER_TEMP/e2-clamd.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true' EXIT
          for attempt in {1..120}; do
            if test -S "$socket"; then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if ! test -S "$socket"; then
            tail -40 "$RUNNER_TEMP/e2-clamd.log"
            exit 1
          fi
          python3 bench/e2/clamd_raw.py --socket "$socket" "$RUNNER_TEMP/corpus/B1" "$RUNNER_TEMP/corpus/B2" | tee "$bench_dir/clamd-raw.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2-${{ matrix.arch }}
          path: ${{ runner.temp }}/e2/
